name: Release

# Push a tag equal to the version in manifest.json (e.g. "1.0.0") to build and publish a release.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      # A zip holding the plugin folder, ready to unzip into <vault>/.obsidian/plugins/
      - name: Package
        run: |
          id=$(node -p "require('./manifest.json').id")
          mkdir -p "package/$id"
          cp dist/main.js dist/manifest.json "package/$id/"
          (cd package && zip -r "../$id-$GITHUB_REF_NAME.zip" "$id")
          echo "ZIP=$id-$GITHUB_REF_NAME.zip" >> "$GITHUB_ENV"

      # main.js and manifest.json are also attached on their own: BRAT installs from those
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" dist/main.js dist/manifest.json --title "$GITHUB_REF_NAME" --generate-notes
